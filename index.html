<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SkyPulse - A modern, real-time interactive weather dashboard featuring 3-day forecast, hourly timeline, AQI, and atmospheric conditions.">
    <meta name="theme-color" content="#0f172a">
    <title>SkyPulse | Real-Time Weather Dashboard</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Phosphor Icons -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default">
    <!-- Atmospheric Ambient Glows -->
    <div class="ambient-glow glow-top"></div>
    <div class="ambient-glow glow-bottom"></div>

    <div class="app-layout">
        <!-- Top Navigation Bar -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-icon">
                    <i class="ph ph-cloud-sun"></i>
                </div>
                <div class="brand-text">
                    <span class="brand-title">SkyPulse</span>
                    <span class="brand-subtitle">Live Atmosphere</span>
                </div>
            </div>

            <!-- Search Area -->
            <form id="search-form" class="search-form" role="search">
                <div class="search-wrapper">
                    <i class="ph ph-magnifying-glass search-icon"></i>
                    <input 
                        type="text" 
                        id="search-input" 
                        class="search-input" 
                        placeholder="Search city (e.g. Delhi, London, Tokyo)..." 
                        autocomplete="off"
                        spellcheck="false"
                        required
                    />
                    <button type="button" id="clear-search-btn" class="clear-btn" aria-label="Clear search">
                        <i class="ph ph-x"></i>
                    </button>
                </div>
                <button type="submit" class="search-btn" id="search-btn" aria-label="Search">
                    <span>Search</span>
                    <i class="ph ph-arrow-right"></i>
                </button>
            </form>

            <!-- Actions: Location & Unit Switcher -->
            <div class="header-actions">
                <button type="button" id="geo-btn" class="action-btn geo-btn" title="Use My Current Location">
                    <i class="ph ph-navigation-arrow"></i>
                    <span class="btn-label">My Location</span>
                </button>

                <div class="unit-toggle" id="unit-toggle" role="group" aria-label="Temperature Unit">
                    <button type="button" class="unit-btn active" data-unit="c">°C</button>
                    <button type="button" class="unit-btn" data-unit="f">°F</button>
                </div>
            </div>
        </header>

        <!-- Quick Select City Chips -->
        <nav class="quick-cities" aria-label="Popular Cities">
            <span class="quick-cities-label"><i class="ph ph-trend-up"></i> Popular:</span>
            <div class="chips-scroll">
                <button type="button" class="city-chip" data-city="New Delhi">New Delhi</button>
                <button type="button" class="city-chip" data-city="Mumbai">Mumbai</button>
                <button type="button" class="city-chip" data-city="Bengaluru">Bengaluru</button>
                <button type="button" class="city-chip" data-city="London">London</button>
                <button type="button" class="city-chip" data-city="New York">New York</button>
                <button type="button" class="city-chip" data-city="Tokyo">Tokyo</button>
                <button type="button" class="city-chip" data-city="Dubai">Dubai</button>
                <button type="button" class="city-chip" data-city="Paris">Paris</button>
            </div>
        </nav>

        <!-- Toast / Notification Alert -->
        <div id="toast" class="toast" role="alert" aria-live="polite">
            <i class="ph ph-warning-circle toast-icon"></i>
            <span class="toast-message" id="toast-message">City not found. Please check the spelling.</span>
        </div>

        <!-- Main Dashboard Content -->
        <main class="dashboard-main" id="dashboard-main">
            <!-- Left Side: Hero Card & 3-Day Forecast -->
            <section class="overview-section">
                <!-- Current Weather Hero Card -->
                <article class="glass-card hero-card" id="hero-card">
                    <div class="hero-header">
                        <div class="location-box">
                            <h1 class="city-name" id="city-name">--</h1>
                            <div class="region-badge" id="region-country">
                                <i class="ph ph-map-pin"></i>
                                <span id="location-text">Loading location...</span>
                            </div>
                        </div>
                        <div class="time-box">
                            <span class="live-tag"><i class="ph ph-broadcast"></i> LIVE</span>
                            <p class="current-time" id="local-time">--:--</p>
                            <p class="current-date" id="local-date">--</p>
                        </div>
                    </div>

                    <div class="hero-body">
                        <div class="temp-display">
                            <div class="temp-visual">
                                <img id="weather-icon" class="weather-icon" src="" alt="Weather condition icon" />
                                <span class="temp-value" id="current-temp">--°</span>
                            </div>
                            <div class="temp-details">
                                <div class="condition-badge" id="condition-text">Loading...</div>
                                <div class="high-low">
                                    <span><i class="ph ph-arrow-up"></i> H: <strong id="temp-max">--°</strong></span>
                                    <span><i class="ph ph-arrow-down"></i> L: <strong id="temp-min">--°</strong></span>
                                </div>
                            </div>
                        </div>

                        <div class="feels-like-pill">
                            <i class="ph ph-thermometer-simple"></i>
                            <span>Feels like <strong id="feels-like-temp">--°</strong></span>
                        </div>
                    </div>
                </article>

            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
